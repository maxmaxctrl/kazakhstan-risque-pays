<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kazakhstan, analyse du risque pays</title>
<style>
:root{
  --cream:#FCF4F0; --ink:#2B2F3A; --ink2:#6B6F7A; --cyan:#00AFCA; --blue:#005F8F; --petrol:#0A3A4A; --deep:#072A36;
  --c1:#D9F3F8; --c2:#7FD6E6; --c4:#00809A; --pink:#D13F8F; --pinkl:#F6E2E4; --line:#E6DAD4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--cream);overflow:hidden;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block}
.slide>img.bg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;pointer-events:none}

/* zones cliquables */
.hs{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hs.word{border-radius:6px;transition:background .2s}
.hs.word::after{content:"";position:absolute;left:0;right:0;bottom:-3px;border-bottom:3px dotted var(--blue);transition:border-color .2s}
.hs.word:hover{background:rgba(0,175,202,.14)}
.hs.word:hover::after{border-bottom-style:solid}
.hs.area{border-radius:16px;transition:box-shadow .2s,background .2s}
.hs.area:hover{box-shadow:0 0 0 3px rgba(0,175,202,.75);background:rgba(0,175,202,.05)}
.hs.icon{border-radius:16px;background-repeat:no-repeat;transition:transform .25s ease,box-shadow .25s ease}
.hs.icon:hover{transform:scale(1.06);box-shadow:0 14px 34px rgba(7,42,54,.2);z-index:5}
.hs.breath{animation:breath 3.6s ease-in-out infinite}
.hs.breath:hover{animation:none}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.hs.dot{border-radius:50%;border:3px solid var(--blue);background:rgba(255,255,255,.55);transition:transform .2s,background .2s}
.hs.dot:hover{transform:scale(1.25);background:rgba(0,175,202,.3)}
.hs.halo{border-radius:50%;pointer-events:auto;border:3px solid rgba(0,175,202,.85);background:radial-gradient(circle,rgba(0,175,202,.30) 0,rgba(0,175,202,.10) 55%,rgba(0,175,202,0) 72%);box-shadow:0 0 18px 4px rgba(0,175,202,.35);transition:transform .25s,box-shadow .25s,opacity .25s;opacity:.8}
.hs.halo:hover,.hs.halo.lit{transform:scale(1.22);opacity:1;box-shadow:0 0 34px 10px rgba(0,175,202,.6)}
body.reveal .hs{outline:2px dashed rgba(0,128,154,.9);outline-offset:2px}
.kw{position:absolute;background:rgba(127,214,230,.30);border-bottom:3px solid #7FD6E6;border-radius:6px;opacity:0;transition:opacity .45s;pointer-events:none}
.kw.on{opacity:1}

/* encarts au survol */
.tip{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(7,42,54,.24);padding:22px 26px;font-size:25px;line-height:1.32;animation:fade .18s ease both}
.tip .tt{font-weight:700;font-size:29px;color:var(--petrol);margin-bottom:6px}
.tip .tx{color:var(--ink)}
.tip .t2{color:var(--ink2);font-size:23px;margin-top:6px}
.tip img.ph{display:block;width:calc(100% + 52px);margin:-22px -26px 16px;border-radius:18px 18px 0 0;object-fit:cover}
.tip .big{font-size:56px;font-weight:700;color:var(--cyan);line-height:1}
.tip .big small{font-size:26px;color:var(--ink2);font-weight:500;margin-left:8px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* fenêtres */
.mw{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;animation:fadebg .2s ease both}
.mw .bd{position:absolute;inset:0;background:rgba(7,42,54,.58)}
.card{position:relative;background:var(--cream);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.4);padding:36px 44px 40px;max-height:1016px;animation:pop .24s ease both}
.card h2{margin:0 60px 20px 0;font-size:42px;line-height:1.15;color:var(--petrol);letter-spacing:-.01em}
.card .x{position:absolute;right:22px;top:20px;width:52px;height:52px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(7,42,54,.15);font-size:30px;line-height:1;cursor:pointer;color:var(--petrol)}
.card .x:hover{background:var(--c1)}
.card .sub{font-size:26px;color:var(--ink2);margin:-8px 0 18px}
.card .row{display:flex;gap:34px;align-items:stretch}
.card .ph{border-radius:18px;display:block;width:100%;object-fit:cover}
.card .cap{margin-top:12px;font-size:28px;font-weight:600;color:var(--petrol)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fadebg{from{opacity:0}to{opacity:1}}

/* superposition des slides masquées */
.ovl{position:absolute;inset:0;z-index:55;background:var(--cream);animation:fadebg .25s ease both}
.ovl img{position:absolute;inset:0;width:1920px;height:1080px}
.btn{position:absolute;z-index:3;border:0;cursor:pointer;font-weight:600;font-size:26px;line-height:1;font-family:inherit;color:#fff;background:var(--petrol);padding:16px 26px;border-radius:40px;box-shadow:0 6px 20px rgba(7,42,54,.3)}
.btn:hover{background:var(--c4)}
.btn.ghost{background:#fff;color:var(--petrol)}
.btn.ghost:hover{background:var(--c1)}

/* graphiques */
.hb{display:flex;flex-direction:column;gap:22px;min-width:900px}
.hbr{display:grid;grid-template-columns:240px 1fr 190px;align-items:center;gap:20px;font-size:28px}
.hbl{font-weight:600;color:var(--ink)}
.hbl.k{color:var(--c4)}
.hbt{position:relative;height:44px;background:transparent}
.hbf,.hbx{position:absolute;top:0;height:44px;border-radius:6px;transform-origin:left;animation:growx .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.hbf{left:0;background:#B7BBC4}
.hbf.k{background:var(--cyan)}
.hbx{background:#E3E5EA;animation-delay:calc(var(--d,0s) + .5s)}
.hbv{font-weight:700;color:var(--ink)}
.hbv.k{color:var(--c4)}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hb.s{min-width:0;gap:12px}
.hb.s .hbr{grid-template-columns:190px 1fr 110px;font-size:23px;gap:12px}
.hb.s .hbt,.hb.s .hbf,.hb.s .hbx{height:30px}
.axt{font-size:25px;color:var(--ink2);margin-bottom:22px}
svg text{font-family:inherit}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drw 1.3s ease .2s forwards}
@keyframes drw{to{stroke-dashoffset:0}}
.seg{animation:sweep 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes sweep{from{stroke-dasharray:0 var(--c)}}
.legend{display:flex;flex-direction:column;gap:20px;font-size:28px}
.legend i{display:inline-block;width:22px;height:22px;border-radius:6px;margin-right:14px;vertical-align:-2px}
.legend b{font-weight:700}
.legend span.s{display:block;color:var(--ink2);font-size:23px;margin-left:36px}
.q{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--cyan);color:#fff;font-weight:700;font-size:28px;border:0;cursor:pointer;flex:none;animation:breath 3.6s ease-in-out infinite}
.q:hover{background:var(--c4);animation:none}
.defbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 28px;font-size:29px;line-height:1.35;margin-bottom:22px}
.defbox .head{display:flex;gap:20px;align-items:flex-start;justify-content:space-between}
.defbox .more{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);color:var(--petrol);font-weight:600;display:none}
.defbox.open .more{display:block;animation:fade .25s both}
.defbox .nm{font-weight:700;color:var(--c4)}
.portraits{display:flex;gap:44px;align-items:center;justify-content:center}
.pt{width:380px;text-align:center}
.pt .im{width:380px;height:380px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 30px rgba(7,42,54,.2);background:#fff}
.pt .im img{width:100%;height:100%;object-fit:cover;display:block}
.pt .nm{font-size:32px;font-weight:700;color:var(--petrol);margin-top:18px}
.pt .dt{font-size:24px;color:var(--ink2);margin-top:4px}
.pt.empty .im{border:6px dashed #B7BBC4;box-shadow:none;background:transparent;display:flex;align-items:center;justify-content:center}
.arrow{font-size:60px;color:var(--c2);font-weight:300}
.chip{display:inline-block;background:var(--c1);color:var(--petrol);border-radius:30px;padding:8px 20px;font-size:25px;font-weight:600}
.agency{display:flex;flex-direction:column;gap:14px;margin:10px 0 24px}
.agency div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px;font-size:29px;line-height:1.3}
.agency b{color:var(--c4)}
.nav{position:absolute;z-index:50;bottom:14px;width:52px;height:52px;border-radius:50%;border:0;background:rgba(107,111,122,.6);color:#fff;font-size:30px;cursor:pointer;opacity:.4;transition:opacity .2s}
.nav:hover{opacity:1}
#hint{position:absolute;z-index:70;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(10,58,74,.88);color:#fff;font-size:22px;padding:10px 24px;border-radius:30px;opacity:0;transition:opacity .5s;pointer-events:none}
#hint.on{opacity:1}
</style>
</head>

  const r=size/2-30, C=2*Math.PI*r; let off=0; let segs='';
  parts.forEach((p,i)=>{
    const len=C*p.v/100;
    segs+=`<circle class="seg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="56" stroke-dasharray="${len-3} ${C-len+3}" stroke-dashoffset="${-off}" style="--c:${C};--d:${i*.25}s" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    off+=len;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}</svg>`;
}

function mapBase(M){

    const c=CLR[p.n]||['#FBF6F2','#CFC6C0',1.1];

}

function corridorSVG(){

  const stops=[['khorgos','Khorgos',0,-30,'middle'],['almaty','Almaty',0,56,'middle'],['aktau','Aktau',-26,12,'end'],['bakou','Bakou',28,12,'start'],['poti','Poti',0,-30,'middle']];

   <path id="rail" d="${M.R.rail}" fill="none" stroke="#005F8F" stroke-width="9" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>

   <circle id="runner" r="15" fill="#00AFCA" stroke="#fff" stroke-width="5" style="opacity:0"/>

function runCorridor(root){
  const svg=$('#corSvg',root); if(!svg) return;
  const rail=$('#rail',svg), sea=$('#sea',svg), onw=$('#onw',svg), run=$('#runner',svg);
  const stops=[...svg.querySelectorAll('.stop')];
  stops.forEach(s=>s.style.opacity=0); sea.style.opacity=0;
  rail.style.transition=onw.style.transition='none'; rail.style.strokeDashoffset=1; onw.style.strokeDashoffset=1;
  const segs=[[rail,0,4600],[sea,1,2300],[onw,2,2600]];
  const seaLen=sea.getTotalLength();
  let t0=null, live=true; root._stop=()=>live=false;
  const reveal={khorgos:0.0,almaty:0.1,aktau:1.0,bakou:2.0,poti:3.0,europe:3.0};
  const shown=new Set();
  function pos(p){ // p dans [0,3]
    if(p<=1){const L=rail.getTotalLength();const q=rail.getPointAtLength(L*p);return q;}
    if(p<=2){return sea.getPointAtLength(seaLen*(p-1));}
    const L=onw.getTotalLength();return onw.getPointAtLength(L*(p-2));
  }
  const total=9500, ph=[[0,4600,0],[4600,6900,1],[6900,9500,2]];
  function frame(ts){
    if(!live) return; if(t0==null)t0=ts; const t=Math.min(ts-t0,total);
    let p;
    if(t<=4600){p=t/4600; rail.style.strokeDashoffset=1-p;}
    else if(t<=6900){p=1+(t-4600)/2300; rail.style.strokeDashoffset=0; sea.style.opacity=1; sea.style.strokeDashoffset=0;}
    else {p=2+(t-6900)/2600; onw.style.strokeDashoffset=1-(p-2);}
    const q=pos(p); run.setAttribute('cx',q.x); run.setAttribute('cy',q.y); run.style.opacity=1;
    stops.forEach(s=>{const k=s.dataset.k; if(reveal[k]!=null && p>=reveal[k] && !shown.has(k)){shown.add(k); s.style.opacity=1;}});
    if(t<total) requestAnimationFrame(frame); else {run.style.opacity=0; stops.forEach(s=>s.style.opacity=1);}
  }
  requestAnimationFrame(frame);
}

/* ---------- construction ---------- */
const slides={}, glowEls={};
ORDER.forEach(n=>{
  const s=el('section','slide'); s.id='slide-'+n;
  s.appendChild(Object.assign(el('img','bg'),{src:`img/s${n}.webp`,alt:''}));
  (H[n]||[]).forEach(h=>s.appendChild(makeHS(n,h)));
  stage.appendChild(s); slides[n]=s;
});
function makeHS(n,h){
  const d=el('div','hs '+(h.k||'area')+(h.breath?' breath':''));
  const [x,y,w,hh]=h.r; Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:hh+'px'});
  if(h.k==='icon'){d.style.backgroundImage=`url(img/s${n}.webp)`;d.style.backgroundPosition=`${-x}px ${-y}px`;d.style.backgroundSize='1920px 1080px';}
  if(h.id) glowEls[h.id]=d;
  d.addEventListener('mouseenter',()=>{ if(h.tip){clearTimeout(tipTimer); tipTimer=setTimeout(()=>showTip(h,d),150);} if(h.glow) h.glow.forEach(g=>glowEls[g]&&glowEls[g].classList.add('lit')); });
  d.addEventListener('mouseleave',()=>{ clearTimeout(tipTimer); if(!pinned) tipTimer=setTimeout(hideTip,140); if(h.glow) h.glow.forEach(g=>glowEls[g]&&glowEls[g].classList.remove('lit')); });
  d.addEventListener('click',e=>{
    e.stopPropagation();
    if(h.open) openModal(h.open); else if(h.ov) openOverlay(h.ov); else if(h.fn==='kw') keywords(n);
    else if(h.tip){ if(pinned&&tipOwner===h){pinned=false;hideTip();} else {pinned=true; showTip(h,d);} }
  });
  return d;
}
function showTip(h,d){
  hideTip(true); const T=TIPS[h.tip]; if(!T) return;
  const t=el('div','tip',T.html); t.style.width=T.w+'px'; t.style.visibility='hidden'; stage.appendChild(t);
  const tw=t.offsetWidth, th=t.offsetHeight; const [x,y,w,hh]=h.r, g=16;
  const cx=x+w/2-tw/2, cy=y+hh/2-th/2;
  const all={b:[cx,y+hh+g],t:[cx,y-th-g],r:[x+w+g,cy],l:[x-tw-g,cy]};
  const order=(h.pl||'b').split('').concat(['b','t','r','l']);
  let pos=null;
  for(const k of order){const [px,py]=all[k]; if(px>=14&&px+tw<=1906&&py>=14&&py+th<=1066){pos=[px,py];break;}}
  if(!pos){const [px,py]=all[order[0]]; pos=[Math.min(Math.max(px,14),1906-tw),Math.min(Math.max(py,14),1066-th)];}
  t.style.left=pos[0]+'px'; t.style.top=pos[1]+'px'; t.style.visibility='';
  t.addEventListener('mouseenter',()=>clearTimeout(tipTimer));
  t.addEventListener('mouseleave',()=>{ if(!pinned) tipTimer=setTimeout(hideTip,140); });
  t.addEventListener('click',e=>e.stopPropagation());
  tipEl=t; tipOwner=h;
}
function hideTip(keep){ if(tipEl){tipEl.remove();tipEl=null;} if(!keep){pinned=false;tipOwner=null;} }
stage.addEventListener('click',()=>{ if(pinned) hideTip(); });

/* mots-clés de la problématique (slide 3) */

function keywords(n){
  const s=slides[n]; s.querySelectorAll('.kw').forEach(k=>k.remove());
  KW.forEach((r,i)=>{const k=el('div','kw'); Object.assign(k.style,{left:r[0]-6+'px',top:r[1]+'px',width:r[2]+12+'px',height:r[3]+'px'}); s.appendChild(k); setTimeout(()=>k.classList.add('on'),i*750);});
}

/* fenêtres et superpositions */
function openModal(id){
  const M=MODALS[id]; if(!M) return; hideTip(); closeModal();
  const mw=el('div','mw'); const bd=el('div','bd'); const c=el('div','card'); c.style.width=M.w+'px';
  c.innerHTML=`<button class="x" aria-label="Fermer">×</button><h2>${M.t}</h2><div class="body">${M.html()}</div>`;
  mw.append(bd,c); stage.appendChild(mw); modalEl=mw;
  bd.onclick=closeModal; $('.x',c).onclick=closeModal;
  if(M.init) M.init(c);
}
function closeModal(){ if(modalEl){ const c=$('.card',modalEl); if(c&&c._stop)c._stop(); modalEl.remove(); modalEl=null; } }
function openOverlay(n){
  hideTip(); closeOverlay();
  const o=el('div','ovl'); o.appendChild(Object.assign(el('img'),{src:`img/s${n}.webp`,alt:''}));
  const back=el('button','btn ghost','← Retour'); back.style.cssText='left:40px;top:36px'; back.onclick=closeOverlay; o.appendChild(back);
  const other=n===4?5:4, lbl=n===4?'Répartition ethnique →':'← Carte de densité';
  const sw=el('button','btn',lbl); sw.style.cssText=n===4?'right:48px;bottom:44px':'left:48px;bottom:44px'; sw.onclick=()=>openOverlay(other); o.appendChild(sw);
  stage.appendChild(o); ovEl=o;
}
function closeOverlay(){ if(ovEl){ovEl.remove();ovEl=null;} }

/* navigation */
function show(i){
  cur=Math.max(0,Math.min(ORDER.length-1,i)); hideTip(); closeModal(); closeOverlay();
  Object.values(slides).forEach(s=>s.classList.remove('on')); slides[ORDER[cur]].classList.add('on');
  $('#hint').classList.remove('on');
}
function goSlide(n){ if(n===4||n===5) return openOverlay(n); const i=ORDER.indexOf(n); if(i>=0) show(i); }
const prev=el('button','nav','‹'), next=el('button','nav','›'); prev.style.left='12px'; next.style.right='12px';
prev.onclick=()=>show(cur-1); next.onclick=()=>show(cur+1); stage.append(prev,next);
const hint=el('div',null,'← → pour naviguer · H pour voir les zones cliquables · Échap pour fermer'); hint.id='hint'; stage.appendChild(hint);
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'){ if(modalEl) closeModal(); else if(ovEl) closeOverlay(); else hideTip(); return; }
  if(modalEl||ovEl){ return; }
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();show(cur+1);}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();show(cur-1);}
  else if(k==='Home') show(0); else if(k==='End') show(ORDER.length-1);
  else if(k==='h'||k==='H') document.body.classList.toggle('reveal');
  else if(k==='f'||k==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
});
show(0); setTimeout(()=>hint.classList.add('on'),600); setTimeout(()=>hint.classList.remove('on'),7500);
